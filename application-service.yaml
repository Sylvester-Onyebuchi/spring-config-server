spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem
  datasource:
    url: jdbc:postgresql://localhost:5430/application_db
    username: sylvester
    password: sylvester
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-version: 0
    baseline-on-migrate: true
    url: jdbc:postgresql://localhost:5430/application_db
    user: sylvester
    password: sylvester
    baseline-description: "init"
    enabled: true
  rabbitmq:
    username: sylvester
    password: sylvester
    port: 5671
    host: localhost
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8081
