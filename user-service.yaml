spring:
  message: Hello user from cloud bus
  datasource:
    url: jdbc:postgresql://localhost:5430/auth_db
    username: sylvester
    password: sylvester
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    baseline-version: 0
    baseline-on-migrate: true
    url: jdbc:postgresql://localhost:5430/auth_db
    user: sylvester
    password: sylvester
    baseline-description: "init"
    enabled: true
  rabbitmq:
    username: sylvester
    password: sylvester
    port: 5671
    host: localhost
  data:
    redis:
      host: localhost
      port: 6380
jwt:
  access-expiration: 900000
  refresh-expiration: 604800000
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
server:
  port: 8085
