server:
  port: 8087

spring:
  data:
    redis:
      host: localhost
      port: 6380
      password: sylvester@life
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: classpath:public.pem

  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

          routes:
            - id: user-service
              uri: lb://user-service
              predicates:
                - Path=/api/v1/auth/**
                - Path=/api/v1/users/**
              

            - id: company-service
              uri: lb://company-service
              predicates:
                - Path=/api/v1/companies/**

            - id: job-service
              uri: lb://job-service
              predicates:
                - Path=/api/v1/jobs/**

            - id: application-service
              uri: lb://application-service
              predicates:
                - Path=/api/v1/applications/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

